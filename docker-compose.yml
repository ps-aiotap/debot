services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    # Using default command

  # Document management service
  docs:
    image: alpine:latest
    volumes:
      - documents_data:/docs
      - ./data:/host_data
    command: |
      sh -c '
      echo "Syncing documents to volume..."
      cp -r /host_data/* /docs/ 2>/dev/null || true
      echo "Documents synced. Volume ready."
      tail -f /dev/null
      '

volumes:
  redis_data:
  chromadb_data:
  documents_data: