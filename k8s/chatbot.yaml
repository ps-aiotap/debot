apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: debot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      initContainers:
      - name: data-loader
        image: debot:latest
        command: ["sh", "-c"]
        args:
        - |
          echo "Copying data files to persistent volume..."
          mkdir -p /shared-data/docs /shared-data/pdfs /shared-data/mds
          cp -r /app/data/* /shared-data/ 2>/dev/null || true
          echo "Data files copied successfully"
        volumeMounts:
        - name: documents-storage
          mountPath: /shared-data
      containers:
        - name: chatbot
          image: debot:latest
          imagePullPolicy: IfNotPresent # Use local image from Docker Desktop
          command:
            [
              'streamlit',
              'run',
              'streamlit_app.py',
              '--server.address',
              '0.0.0.0',
              '--server.port',
              '8502'
            ]
          ports:
            - containerPort: 8502
          volumeMounts:
          - name: documents-storage
            mountPath: /app/data
          envFrom:
            - configMapRef:
                name: debot-config
            - secretRef:
                name: debot-secrets
      volumes:
      - name: documents-storage
        persistentVolumeClaim:
          claimName: documents-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-service
  namespace: debot
spec:
  selector:
    app: chatbot
  ports:
    - port: 8502
      targetPort: 8502
  type: LoadBalancer
